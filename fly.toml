# Fly.io configuration for Job RAG walking skeleton.
# Run `fly launch --no-deploy --copy-config` to register an app name in your account,
# then `fly secrets set OPENAI_API_KEY=... DATABASE_URL=... APP_PASSCODE=...` and `fly deploy`.

app = "job-rag"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8501"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/_stcore/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
