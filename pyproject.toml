[tool.poetry]
name = "job-rag"
version = "0.1.0"
description = "Resume editor MVP using Evidence RAG and Style RAG"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.12.3"
streamlit = "^1.39.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
openai = "^1.54.3"
anthropic = "^0.39.0"
playwright = "^1.48.0"
beautifulsoup4 = "^4.12.3"
pdfplumber = "^0.11.3"
lxml = "^5.3.0"
psycopg2-binary = "^2.9.10"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
tenacity = "^9.0.0"
tiktoken = "^0.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.9"
mypy = "^1.7.0"
pre-commit = "^3.7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "prompts", "prompts_dev", "__pycache__", "worktree-*", ".worktrees"]

[tool.ruff.lint]
# Start conservative: real errors, unused code, import order, common bugs, py-version upgrades.
# Expand the rule set once the baseline is clean. New rules should ship with a clear
# remediation message so agents can self-correct without human input.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Typer/FastAPI-style default-arg calls are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
"scripts/**" = ["B"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
